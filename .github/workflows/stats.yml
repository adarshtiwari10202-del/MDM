name: Flag statistics

# Read-only: reports average schools flagged per day and how many schools have a
# 3-consecutive-day red streak. No AI, no writes — runs in seconds.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run stats
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          RESULTS_SHEET_TAB: Results
        run: node scripts/stats.js
      - name: Commit stats JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/flag_stats.json
          git commit -m "data: flag_stats.json snapshot [skip ci]" || echo "no changes"
          git push origin HEAD:claude/mdm-monitoring-pipeline-xd3l9p
