name: Missed last 3 days

on:
  workflow_dispatch:
    inputs:
      days:
        description: Comma-separated reporting dates to check (YYYY-MM-DD)
        default: '2026-09-29,2026-09-30,2026-10-01'
      cutoff_day:
        description: 'Optional in-progress day to gate by time (YYYY-MM-DD); blank = count all submissions'
        default: ''
      cutoff_time:
        description: 'Cutoff time IST (HH:MM:SS), inclusive — only used if cutoff_day set'
        default: '19:00:00'

permissions:
  contents: write

jobs:
  missed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run missed-3-days report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAILY_SHEET_ID: ${{ secrets.DAILY_SHEET_ID }}
          DAILY_SHEET_TAB: Form Responses 1
          ROSTER_SHEET_TAB: Sheet1
          DAYS: ${{ github.event.inputs.days }}
          CUTOFF_DAY: ${{ github.event.inputs.cutoff_day }}
          CUTOFF_TIME: ${{ github.event.inputs.cutoff_time }}
        run: node scripts/missed3days.js
      - name: Commit authoritative JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/missed3days.json
          git commit -m "data: missed3days.json snapshot [skip ci]" || echo "no changes"
          git push origin HEAD:claude/mdm-monitoring-pipeline-xd3l9p
