name: Flag distribution

on:
  workflow_dispatch: {}

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run distribution
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          RESULTS_SHEET_TAB: Results
          DAILY_SHEET_ID: ${{ secrets.DAILY_SHEET_ID }}
          DAILY_SHEET_TAB: Form Responses 1
        run: node scripts/flag-distribution.js
