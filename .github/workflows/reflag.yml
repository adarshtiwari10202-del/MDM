name: Re-flag stored results

# Recompute duplicates + flags over the existing results store using the
# current flag rules. No AI, no media fetch — runs in seconds.
on:
  workflow_dispatch: {}

jobs:
  reflag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run re-flag
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          RESULTS_SHEET_TAB: Results
        run: node scripts/reflag.js
