name: Reconcile submission dates

# Reconciles each stored submission's grouping date using the manual
# "Today's Date" field + Google's submission timestamp. Dry-run by default
# (reports only); set apply=true to rewrite the results store.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Set true to APPLY (rewrite the store). Otherwise dry-run.
        default: 'false'

jobs:
  fixdates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Reconcile dates
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          RESULTS_SHEET_TAB: Results
          DRYRUN: ${{ github.event.inputs.apply == 'true' && '0' || '1' }}
        run: node scripts/fixdates.js
