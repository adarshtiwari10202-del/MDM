name: Verify profile-form list

# Read-only high-stakes cross-check of the "profile form NOT submitted" list.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Verify
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAILY_SHEET_ID: ${{ secrets.DAILY_SHEET_ID }}
          ROSTER_SHEET_TAB: Sheet1
          PROFILE_SHEET_ID: 1yh2VUK_CUvXbCcr4RlPd7oYaQpx1GVigmlyFl59sA5k
          PROFILE_SHEET_TAB: Form Responses 1
        run: node scripts/verify-profile.js
