name: Open-ended AI probe

# Runs a free-form (no schema, no checklist) Gemini analysis on one school's
# four media files for one date, to see what the model can extract on its own.
on:
  workflow_dispatch:
    inputs:
      udise:
        description: School UDISE code
        required: true
        default: '9240501403'
      date:
        description: Date (YYYY-MM-DD)
        required: true
        default: '2026-09-19'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          RESULTS_SHEET_TAB: Results
          PROBE_UDISE: ${{ github.event.inputs.udise }}
          PROBE_DATE: ${{ github.event.inputs.date }}
        run: node scripts/probe.js
