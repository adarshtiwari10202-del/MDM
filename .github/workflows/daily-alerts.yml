name: Daily Glific alerts (non-sub + menu non-compliance)

# Build the Glific "Lookup" sheet for a reporting day. Fills TWO groups of rows:
#   (A) schools that did not submit that day
#   (B) schools that submitted but the AI flagged them for menu_missing,
#       with the specific missing item named in the message.
# Dry-run by default; set write=true to publish.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Reporting day, ISO (YYYY-MM-DD)'
        type: string
        required: true
      date_hindi:
        description: 'Date in Hindi for the message, e.g. "17 नवंबर"'
        type: string
        required: true
      write:
        description: 'Publish to the Lookup tab (Glific will send). Leave false to dry-run.'
        type: boolean
        default: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build daily alerts Lookup (non-sub + menu-missing)
        env:
          DATA_MODE: live
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAILY_SHEET_ID: ${{ secrets.DAILY_SHEET_ID }}
          BASELINE_SHEET_ID: ${{ secrets.BASELINE_SHEET_ID }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          DAILY_SHEET_TAB: Form Responses 1
          BASELINE_SHEET_TAB: Form Responses 1
          RESULTS_SHEET_TAB: Results
          GLIFIC_SHEET_ID: 10jvk-rncjtv6iiwWJe7OwAr4Ojt3tvYPZHQKFs1F-Ac
          ROSTER_TAB: All HM Contacts
          LOOKUP_TAB: Lookup
        run: node scripts/daily-alerts.js --date='${{ inputs.date }}' --date-hindi='${{ inputs.date_hindi }}' ${{ inputs.write && '--write' || '' }}
