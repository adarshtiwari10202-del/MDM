name: Daily non-compliance lists

on:
  workflow_dispatch:
    inputs:
      date_min:
        description: Earliest reporting date to count (YYYY-MM-DD, inclusive; blank = all)
        default: ''
      date_max:
        description: Latest reporting date to count (YYYY-MM-DD, inclusive; blank = all)
        default: ''

jobs:
  noncompliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run non-compliance report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAILY_SHEET_ID: ${{ secrets.DAILY_SHEET_ID }}
          DAILY_SHEET_TAB: Form Responses 1
          ROSTER_SHEET_TAB: Sheet1
          DATE_MIN: ${{ github.event.inputs.date_min }}
          DATE_MAX: ${{ github.event.inputs.date_max }}
        run: node scripts/noncompliance.js
