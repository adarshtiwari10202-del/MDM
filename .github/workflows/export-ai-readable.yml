name: Export AI analysis (readable sheet)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 16 * * *'   # 21:30 IST, after the nightly process (14:30 UTC) run

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Export readable AI analysis
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
          RESULTS_SHEET_TAB: Results
          AI_SHEET_ID: 1Hv1_ovqbwePuAWMPGLktAPiF47uZwWtcyMSEM7TTl-w
          AI_SHEET_TAB: AI Analysis
        run: node scripts/export-ai-readable.js
