name: Report missing-submission lists

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Daily-form date to check (YYYY-MM-DD)
        default: '2026-09-24'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Report lists
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DAILY_SHEET_ID: ${{ secrets.DAILY_SHEET_ID }}
          DAILY_SHEET_TAB: Form Responses 1
          ROSTER_SHEET_TAB: Sheet1
          PROFILE_SHEET_ID: 1yh2VUK_CUvXbCcr4RlPd7oYaQpx1GVigmlyFl59sA5k
          PROFILE_SHEET_TAB: Form Responses 1
          REPORT_DATE: ${{ github.event.inputs.report_date || '2026-09-24' }}
        run: node scripts/report-lists.js
